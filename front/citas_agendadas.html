<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Citas Agendadas</title>
    <!-- bootstrap css -->
    <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css" />
    <!-- style css -->
    <link rel="stylesheet" type="text/css" href="css/style.css" />
    <!-- Responsive-->
    <link rel="stylesheet" href="css/responsive.css" />
    <!-- fevicon -->
    <link rel="icon" href="images/fevicon.png" type="image/gif" />
    <!-- Scrollbar Custom CSS -->
    <link rel="stylesheet" href="css/jquery.mCustomScrollbar.min.css" />
    <!-- fonts -->
    <link
      href="https://fonts.googleapis.com/css?family=Dancing+Script:400,700|Poppins:400,700&display=swap"
      rel="stylesheet"
    />
    <!-- owl stylesheets -->
    <link rel="stylesheet" href="css/owl.carousel.min.css" />
    <link rel="stylesheet" href="css/owl.theme.default.min.css" />
    <link
      href="https://unpkg.com/gijgo@1.9.13/css/gijgo.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <style>
      /* Modal estilo cuadrado */
      .modal {
        display: none; /* oculto por defecto */
        position: fixed;
        z-index: 1050;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(0, 0, 0, 0.5);
      }
      .modal-content {
        background-color: #fff;
        margin: 10% auto;
        padding: 20px;
        border: 1px solid #ccc;
        width: 500px;
        max-width: 90%;
        border-radius: 8px;
      }
      .close-button {
        float: right;
        font-size: 1.5rem;
        font-weight: bold;
        cursor: pointer;
      }
      .modal-body p {
        margin-bottom: 0.5rem;
      }
    </style>
  </head>
  <body>
    <!-- header top section start -->
    <div class="header_top_section">
      <div class="container">
        <div class="row">
          <div class="col-sm-12">
            <div class="header_top_main">
              <div class="call_text">
                <a href="#">
                  <span class="padding_right0">
                    <i class="fa fa-phone" aria-hidden="true"></i>
                  </span>
                  Tel : +01 1234567890
                </a>
              </div>
              <div class="call_text_2">
                <a href="#">
                  <span class="padding_right0">
                    <i class="fa fa-envelope" aria-hidden="true"></i>
                  </span>
                  torremedicastamonica@gmail.com
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- header section start -->
    <div class="header_section">
      <div class="container">
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
          <a class="navbar-brand" href="index.html">
            <img src="images/logo.png" alt="Logo" />
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-toggle="collapse"
            data-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ml-auto">
              <li class="nav-item">
                <a class="nav-link" href="index.html">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-danger" href="#" id="logoutBtn">Logout</a>
              </li>
            </ul>
          </div>
        </nav>
      </div>
    </div>
    <!-- header section end -->

    <!-- citas section -->
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
      <div class="citas">
        <h2 class="text-center mb-4" id="form-title">Citas Agendadas</h2>
        <table class="table table-striped">
          <thead>
            <tr>
              <th>ID Cita</th>
              <th>Fecha</th>
              <th>Hora Inicio</th>
              <th>Hora Fin</th>
              <th>Estado</th>
              <th>Nombre</th>
              <th>Apellido</th>
            </tr>
          </thead>
          <tbody id="tablaCitas"></tbody>
        </table>
      </div>
    </div>

    <!-- Modal datos del médico estilo cuadrado -->
    <div id="medicoModal" class="modal">
      <div class="modal-content">
        <span class="close-button" data-modal="medicoModal">&times;</span>
        <h2>Datos del médico</h2>
        <div class="modal-body" id="medicoModalBody">
          <!-- Se llena dinámicamente -->
        </div>
      </div>
    </div>

    <!-- Javascript files (orden correcto) -->
    <script src="js/jquery.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>

    <script src="js/plugin.js"></script>
    <script src="js/jquery.mCustomScrollbar.concat.min.js"></script>
    <script src="js/custom.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fancybox/2.1.5/jquery.fancybox.min.js"></script>
    <script src="https://unpkg.com/gijgo@1.9.13/js/gijgo.min.js" type="text/javascript"></script>

    <!-- Script para llenar citas -->
    <script src="js/citas.js"></script>
    <script src="js/datosCita.js"></script>

    <!-- Script para logout y modal -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const logoutBtn = document.getElementById("logoutBtn");
        logoutBtn.addEventListener("click", (e) => {
          e.preventDefault();
          localStorage.clear();
          window.location.href = "index.html";
        });

        // Modal básico
        const modal = document.getElementById("medicoModal");
        const closeBtn = modal.querySelector(".close-button");

        // Cerrar modal al hacer clic en la X
        closeBtn.addEventListener("click", () => {
          modal.style.display = "none";
        });

        // Cerrar modal al hacer clic fuera del contenido
        window.addEventListener("click", (event) => {
          if (event.target === modal) {
            modal.style.display = "none";
          }
        });

        // Función para abrir modal desde datosCita.js
        window.openMedicoModal = function (contenido) {
          document.getElementById("medicoModalBody").innerHTML = contenido;
          modal.style.display = "block";
        };
      });
    </script>
  </body>
</html>
