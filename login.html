      <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="login-container">
            <h2 class="text-center mb-4" id="form-title">Inicio de Sesión</h2>
            <!-- Formulario de Login -->
            <div id="login">
             <input type="text" id="loginEmail" placeholder="Email"><br>
             <input type="password" id="loginPassword" placeholder="Password"><br>
             <button onclick="login()">Iniciar Sesión</button>
            </div>
        </div>

      <!-- about section end -->
      <!-- Javascript files-->
      <script>
      // Configuración Amplify con tu pool de Cognito
      Amplify.configure({
      Auth: {
        region: "us-east-2", // ajusta a tu región
        userPoolId: "us-east-2_3d9dAMKXZ", // tu User Pool ID
        userPoolWebClientId: "1vd7m5lcdd8r9nr5clfga3rctb", // tu App Client ID
        }
      });
      // Login
      async function login() {
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;
      try {
        const user = await Amplify.Auth.signIn(email, password);
        document.getElementById("login").style.display = "none";
        document.getElementById("registro").style.display = "none";
        document.getElementById("confirmacion").style.display = "none";
        document.getElementById("panel").style.display = "block";
        document.getElementById("usuario").innerText = "Usuario: " + user.username;
      } catch (err) {
        alert("Error en login: " + err.message);
      }
      }
      </script>
